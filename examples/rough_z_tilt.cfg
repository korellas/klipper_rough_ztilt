# Include only alongside an existing native [z_tilt]. No dimensions required.
[rough_z_tilt]
scale: 0.3333333333333333
# center defaults to the mean of the native measurement points.
# Set a printer-specific center here if its Z home location is preferable.
retries: 3
retry_tolerance: 0.1
# speed and horizontal_move_z default to the native z_tilt values.

# Insert this sequence inside the printer's existing probe-safe tilt wrapper:
# ROUGH_Z_TILT
# <existing native full-size Z tilt command>
# Keep homing, probe docking, temperature management and Z rehoming there.
