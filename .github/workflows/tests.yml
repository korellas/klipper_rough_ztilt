name: Tests
on: [push, pull_request]
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        klipper: [31fe50ffa387ed4a45950c1043a3b214a9d554dd, master]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Klipper3d/klipper
          ref: ${{ matrix.klipper }}
          path: .native-klipper
      - run: KLIPPER_PATH="$GITHUB_WORKSPACE/.native-klipper" python3 -m unittest discover -s tests -v
